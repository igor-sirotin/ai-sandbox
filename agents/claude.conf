# Claude Code — https://claude.com/claude-code
#
# Installed into the VM on first use (see `ensure_agent` in ./sandbox), not by
# the Lima template, so existing VMs pick it up too. The native installer puts
# the binary in ~/.local/bin and self-updates from there; it must run as the VM
# user (it refuses to run under sudo).

agent_desc    'Claude Code (Anthropic)'
agent_bin     claude
agent_path    '$HOME/.local/bin'
agent_install 'curl -fsSL https://claude.ai/install.sh | bash'
agent_launch  'exec claude agents --dangerously-skip-permissions "$@"'
