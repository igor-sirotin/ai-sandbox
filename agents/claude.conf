# Claude Code — https://claude.com/claude-code
#
# Installed into the VM on first use (see `ensure_agent` in ./sandbox), not by
# the Lima template, so existing VMs pick it up too. The native installer puts
# the binary in ~/.local/bin and self-updates from there; it must run as the VM
# user (it refuses to run under sudo).

agent_desc    'Claude Code (Anthropic)'
agent_bin     claude
agent_path    '$HOME/.local/bin'
agent_install 'curl -fsSL https://claude.ai/install.sh | bash'
agent_launch  'exec claude agents --dangerously-skip-permissions "$@"'

# Background daemon: Remote Control. Installed as a systemd user unit with
# lingering on, so it is up whenever the VM is — you can drive this sandbox from
# claude.ai/code or the Claude app with no terminal attached to the VM. Sessions
# it spawns land in ~/workspace with permission prompts off, same as the TUI.
# It needs the VM's Claude Code to be logged in once (`sandbox <project> claude`
# -> /login); until then the unit just restarts and fails.
agent_daemon  'exec claude remote-control \
    --permission-mode bypassPermissions \
    --remote-control-session-name-prefix "sandbox-${SANDBOX_PROJECT:-$(hostname)}"'
