# OpenCode — https://opencode.ai
#
# The install script hardcodes INSTALL_DIR=$HOME/.opencode/bin (no env override),
# hence the agent_path below. `"permission": "allow"` is OpenCode's equivalent of
# Claude's --dangerously-skip-permissions: the TUI has no skip-permissions flag,
# it's configured in ~/.config/opencode/opencode.json. Written only if absent, so
# hand-edits inside the VM survive.

agent_desc    'OpenCode (open source, multi-provider)'
agent_bin     opencode
agent_path    '$HOME/.opencode/bin'
agent_install 'curl -fsSL https://opencode.ai/install | bash'
agent_setup   '
    mkdir -p "$HOME/.config/opencode"
    cfg="$HOME/.config/opencode/opencode.json"
    [ -f "$cfg" ] || printf "{\n  \"\$schema\": \"https://opencode.ai/config.json\",\n  \"permission\": \"allow\"\n}\n" > "$cfg"
'
agent_launch  'exec opencode "$@"'
